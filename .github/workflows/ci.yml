name: Testes e Deploy

# Roda a cada envio para a branch principal, em pull requests,
# e também pelo botao "Run workflow" na aba Actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1) TESTES — sempre rodam. Se falharem, nada e publicado.
  # ────────────────────────────────────────────────────────────────
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar sintaxe das paginas
        run: node tests/sintaxe.js

      - name: Regras de reserva
        run: node tests/reservas.test.js

      - name: Assistente Condominio (busca nos regulamentos)
        run: node tests/assistente.test.js

      - name: Informacoes Gerais (telefones e WhatsApp)
        run: node tests/infogerais.test.js

      - name: Lembretes de reserva (cobranca que ja foi paga)
        run: node tests/lembretes.test.js

  # ────────────────────────────────────────────────────────────────
  # 2) DEPLOY das Edge Functions do Supabase
  #    So roda na branch main e so se os testes passarem.
  #    Requer, em Settings -> Secrets and variables -> Actions:
  #      SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens)
  #      SUPABASE_PROJECT_REF   (lusibpbafbkyygxrxvzr)
  #    Faltando algum, o workflow FALHA e diz qual — de proposito.
  #    Pular em silencio faria o check verde mentir: voce acharia que
  #    publicou e nao publicou.
  # ────────────────────────────────────────────────────────────────
  deploy-funcoes:
    needs: testes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se os segredos estao configurados
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          falta=""
          if [ -z "$TOKEN" ]; then falta="$falta SUPABASE_ACCESS_TOKEN"; fi
          if [ -z "$REF" ];   then falta="$falta SUPABASE_PROJECT_REF"; fi
          if [ -n "$falta" ]; then
            echo "::error::Nada foi publicado. Faltam estes segredos no repositorio:$falta"
            echo "Crie em: Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "Segredos encontrados. Seguindo para a publicacao."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # A pasta do codigo chama "notificar", mas a funcao publicada
      # tem o slug "dynamic-handler" — por isso a copia antes.
      - name: Publicar funcao dynamic-handler (notificar)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p supabase/functions/dynamic-handler
          cp supabase/functions/notificar/index.ts supabase/functions/dynamic-handler/index.ts
          supabase functions deploy dynamic-handler --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # Mesma coisa: a pasta e "lembretes" (plural), a funcao e "lembrete".
      - name: Publicar funcao lembrete
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p supabase/functions/lembrete
          cp supabase/functions/lembretes/index.ts supabase/functions/lembrete/index.ts
          supabase functions deploy lembrete --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # Assistente Condominio: pasta e slug tem o mesmo nome.
      - name: Publicar funcao assistente
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy assistente --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Resumo
        run: echo "Funcoes publicadas. Confira em Supabase -> Edge Functions."

  # ────────────────────────────────────────────────────────────────
  # NAO EXISTE JOB DE MIGRATIONS AQUI, e e de proposito.
  #
  #    Existiu um, que rodava "supabase db push" a cada envio para a main.
  #    Ele nunca funcionou: exigia o segredo SUPABASE_DB_URL, que nunca foi
  #    cadastrado, entao FALHAVA no primeiro passo em toda execucao.
  #
  #    Um CI que fica sempre vermelho e pior do que CI nenhum: ele ensina a
  #    ignorar o X. Foi mais ou menos assim que, em 13/08, dois commits com
  #    erro de sintaxe passaram -- o vermelho ja era paisagem.
  #
  #    E o job tambem contrariava a politica escrita em DEPLOY.md: mudanca
  #    de banco e rodada A MAO no SQL Editor, de proposito, porque merece
  #    revisao antes. Os arquivos em supabase/*.sql sao a fonte para isso.
  #
  #    Se um dia quiser automatizar: recrie o job, cadastre o segredo
  #    SUPABASE_DB_URL (Supabase -> Project Settings -> Database ->
  #    Connection string -> URI, com a senha) e resolva a duplicidade entre
  #    supabase/*.sql e supabase/migrations/, que hoje descrevem as mesmas
  #    mudancas em dois lugares.
  # ────────────────────────────────────────────────────────────────

  # ────────────────────────────────────────────────────────────────
  # 3) PUBLICACAO DO SITE (adminprogestao.com.br)
  #
  #    Antes o GitHub Pages publicava direto da branch main, SEM esperar
  #    os testes. Em 13/08 isso custou caro: dois commits com erro de
  #    sintaxe foram para o ar, o CI marcou vermelho nos dois, e o site
  #    ficou sem login mesmo assim — o portao existia e nao estava no
  #    caminho da porta.
  #
  #    Agora a publicacao e um passo daqui, com "needs: testes". Teste
  #    vermelho, site nao sobe: fica no ar a ultima versao que passou.
  #
  #    A origem do Pages precisa estar em "GitHub Actions" (Settings ->
  #    Pages -> Build and deployment -> Source). Na primeira execucao o
  #    proprio actions/configure-pages fez essa troca sozinho, porque este
  #    job tem permissao pages:write -- nao foi preciso clicar em nada.
  #
  #    O passo de aviso abaixo ficou como rede: se alguem trocar a origem
  #    de volta para "Deploy from a branch", ou se a permissao mudar, o job
  #    FALHA dizendo o que fazer em vez de pular calado. Pular calado
  #    deixaria o check verde mentir, que e o erro que este job corrige.
  # ────────────────────────────────────────────────────────────────
  publicar-site:
    needs: testes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Uma publicacao por vez, e sem cancelar a que ja esta em andamento:
    # deploy pela metade e pior do que deploy em fila.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar o Pages
        id: preparar
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Explicar se o Pages ainda nao esta no modo Actions
        if: steps.preparar.outcome != 'success'
        run: |
          echo "::error::O site NAO foi publicado. Falta trocar a origem do GitHub Pages."
          echo "Va em: Settings -> Pages -> Build and deployment -> Source"
          echo "Troque de 'Deploy from a branch' para 'GitHub Actions' e rode este workflow de novo."
          echo "Ate la o site continua no ar pela publicacao antiga, direto da main."
          exit 1

      # Sobe o repositorio inteiro, igual ao que a publicacao por branch
      # ja fazia. Mudar o que e servido nao e assunto deste commit.
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4

      - name: Resumo
        run: echo "Site publicado em ${{ steps.publicar.outputs.page_url }}"
