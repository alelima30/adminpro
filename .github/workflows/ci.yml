name: Testes e Deploy

# Roda a cada envio para a branch principal, em pull requests,
# e também pelo botao "Run workflow" na aba Actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1) TESTES — sempre rodam. Se falharem, nada e publicado.
  # ────────────────────────────────────────────────────────────────
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar sintaxe das paginas
        run: node tests/sintaxe.js

      - name: Regras de reserva
        run: node tests/reservas.test.js

  # ────────────────────────────────────────────────────────────────
  # 2) DEPLOY das Edge Functions do Supabase
  #    So roda na branch main e so se os testes passarem.
  #    Requer, em Settings -> Secrets and variables -> Actions:
  #      SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens)
  #      SUPABASE_PROJECT_REF   (lusibpbafbkyygxrxvzr)
  #    Faltando algum, o workflow FALHA e diz qual — de proposito.
  #    Pular em silencio faria o check verde mentir: voce acharia que
  #    publicou e nao publicou.
  # ────────────────────────────────────────────────────────────────
  deploy-funcoes:
    needs: testes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se os segredos estao configurados
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          falta=""
          if [ -z "$TOKEN" ]; then falta="$falta SUPABASE_ACCESS_TOKEN"; fi
          if [ -z "$REF" ];   then falta="$falta SUPABASE_PROJECT_REF"; fi
          if [ -n "$falta" ]; then
            echo "::error::Nada foi publicado. Faltam estes segredos no repositorio:$falta"
            echo "Crie em: Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "Segredos encontrados. Seguindo para a publicacao."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # A pasta do codigo chama "notificar", mas a funcao publicada
      # tem o slug "dynamic-handler" — por isso a copia antes.
      - name: Publicar funcao dynamic-handler (notificar)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p supabase/functions/dynamic-handler
          cp supabase/functions/notificar/index.ts supabase/functions/dynamic-handler/index.ts
          supabase functions deploy dynamic-handler --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # Mesma coisa: a pasta e "lembretes" (plural), a funcao e "lembrete".
      - name: Publicar funcao lembrete
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p supabase/functions/lembrete
          cp supabase/functions/lembretes/index.ts supabase/functions/lembrete/index.ts
          supabase functions deploy lembrete --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Resumo
        run: echo "Funcoes publicadas. Confira em Supabase -> Edge Functions."

  # ────────────────────────────────────────────────────────────────
  # 3) MIGRATIONS do banco (supabase/migrations/)
  #    Roda DEPOIS das funcoes: a migration do cron aponta para a
  #    funcao "lembrete", entao ela precisa existir antes.
  #    Requer mais um segredo:
  #      SUPABASE_DB_URL  (Supabase -> Project Settings -> Database
  #                        -> Connection string -> URI, com a senha)
  #    So aplica arquivo novo: o que ja foi aplicado fica registrado
  #    em supabase_migrations.schema_migrations e nao roda de novo.
  # ────────────────────────────────────────────────────────────────
  migrar-banco:
    needs: deploy-funcoes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir o segredo do banco
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB" ]; then
            echo "::error::Nenhuma migration aplicada. Falta o segredo SUPABASE_DB_URL."
            echo "Pegue em: Supabase -> Project Settings -> Database -> Connection string -> URI"
            echo "Crie em:  Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "Segredo encontrado. Seguindo para as migrations."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migrations
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$DB" --include-all

# O site (adminprogestao.com.br) ja e publicado automaticamente pelo
# GitHub Pages a partir da branch main — nao precisa de passo aqui.
